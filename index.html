<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星汐｜此微夢</title>
  <style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #07060d;
  }
    .cover {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
    }
    .cover img {
  position: absolute;
}

.background,
.shards,
.frame {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
    .background { z-index: 1; }
.shards    { z-index: 2; }
.emblem    { z-index: 3; }
.logo      { z-index: 4; }
.frame     { z-index: 5; }
   .emblem,
.logo {
  left: 50%;
  transform: translateX(-50%);
  height: auto;
}

.shards {
  transform-origin: center center;
  animation: shards-drift 16s ease-in-out infinite;
}

@keyframes shards-drift {
  0%, 100% {
    transform: rotate(-0.4deg);
  }

  50% {
    transform: rotate(0.4deg);
  }
}

.emblem {
  width: 68%;
  top: 12%;

}

.logo {
  width: 62%;
  top: 46%;
}
    .enter-area {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: 76%;
  transform: translateX(-50%);
  width: 80%;
  text-align: center;
  color: #eadfc9;
  letter-spacing: 0.18em;
  text-shadow:
    0 0 8px rgba(224, 205, 255, 0.45),
    0 0 16px rgba(255, 232, 185, 0.22);
  cursor: pointer;
  transition: opacity 0.3s ease, text-shadow 0.3s ease;
}

.enter-area:active {
  opacity: 0.65;
  text-shadow:
    0 0 12px rgba(224, 205, 255, 0.8),
    0 0 24px rgba(255, 232, 185, 0.5);
}

.enter-line {
  font-size: 13px;
  font-family: "Noto Serif TC", "PMingLiU", serif;
  opacity: 0.82;
}

.enter-word {
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: 0.45em;
  opacity: 0.65;
}
  
  </style>
</head>

<body>
  <main class="cover">
    <img class="background" src="images/home/background.png" alt="">
    <img class="shards" src="images/home/shards.png" alt="">
    <img class="emblem" src="images/home/emblem.png" alt="">
    <img class="logo" src="images/home/logo.png" alt="">
    <div class="enter-area">
  <div class="enter-line">拾起一片星光，走入此微夢。</div>
  <div class="enter-word">ENTER</div>
    </div>
    <img class="frame" src="images/home/frame.png" alt="">
  </main>
</body>

</html>
