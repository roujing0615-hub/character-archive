  <style>

    /* ==================================================
       基礎設定｜BASE
    ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Noto Serif TC", "PMingLiU", serif;
    }

    body {
      background: #07060d;
    }



    /* ==================================================
       封面｜COVER
    ================================================== */

    #cover-page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #07060d;
    }

    #cover-page img {
      position: absolute;
    }


    /* ----- 封面圖片層 ----- */

    .background,
    .shards,
    .frame {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .background {
      z-index: 1;
    }

    .shards {
      z-index: 2;
    }

    .emblem {
      z-index: 3;
    }

    .logo {
      z-index: 4;
    }

    .frame {
      z-index: 5;
    }

    .emblem,
    .logo {
      left: 50%;
      transform: translateX(-50%);
      height: auto;
    }


    /* ----- 碎片微動 ----- */

    .shards {
      transform-origin: center center;
      animation: shards-drift 16s ease-in-out infinite;
    }

    @keyframes shards-drift {

      0%,
      100% {
        transform: rotate(-0.4deg);
      }

      50% {
        transform: rotate(0.4deg);
      }

    }


    /* ----- 封面主圖位置 ----- */

    .emblem {
      width: 68%;
      top: 12%;
    }

    .logo {
      width: 62%;
      top: 46%;
    }


    /* ----- ENTER 透明點擊區 ----- */

    .enter-area {
      position: absolute;
      z-index: 6;

      left: 50%;
      top: 72%;
      transform: translateX(-50%);

      width: 72%;
padding: 10px 0;
text-align: center;

color: #eadfc9;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-area:active {
      opacity: 0.8;
    }
    .enter-line {
  font-size: 13px;
  letter-spacing: 0.18em;
  opacity: 0.82;
}

.enter-word {
  margin-top: 10px;
  font-family: Georgia, serif;
  font-size: 10px;
  letter-spacing: 0.45em;
  opacity: 0.68;
}



    /* ==================================================
       總目錄｜CONTENTS
    ================================================== */

    #world-page {
      display: none;

      position: relative;

      width: 100%;
      min-height: 100vh;

      color: #5f5868;

      background-color: #f5f0ed;

      background-image:
        url("images/home/contents-bg.png");

      background-position: center top;
      background-size: cover;
      background-repeat: no-repeat;

      padding:
        34px 18px 46px;
    }



    /* ==================================================
       目錄上方｜CONTENTS HEADER
    ================================================== */

    .contents-header {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      color: #3f3544;
    }



    /* ==================================================
       頂部導覽｜TOP NAV
    ================================================== */

    .top-nav-shell {
      position: relative;

      width: 100%;

      padding:
        11px 12px;

      background:
        rgba(255, 252, 248, 0.42);

      border:
        1px solid rgba(169, 134, 100, 0.15);

      box-shadow:
        0 5px 18px rgba(87, 67, 91, 0.05);

      backdrop-filter:
        blur(4px);

      -webkit-backdrop-filter:
        blur(4px);
    }


    .top-nav {
      position: relative;
margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;
    }



    /* ----- 左上品牌 ----- */

    .brand {
      display: flex;
      align-items: center;

      gap: 8px;

      flex-shrink: 0;
    }

    .brand-title {
      color: #44384a;

      font-size: 27px;
      line-height: 1;

      letter-spacing: 3px;
      white-space: nowrap;
    }

    .brand-side {
      padding-top: 1px;
    }

    .brand-en {
      font-family: Georgia, serif;

      color: #55475a;

      font-size: 8px;
      letter-spacing: 3px;
    }

    .brand-tagline {
      margin-top: 3px;

      font-family: Georgia, serif;

      font-size: 5px;
      font-style: italic;
      letter-spacing: 0.8px;

      opacity: 0.72;

      white-space: nowrap;
    }

.nav-links a,
.nav-links a:link,
.nav-links a:visited,
.nav-links a:hover,
.nav-links a:active {
  color: #453949;
  text-decoration: none;
}

    /* ----- 右側導覽 ----- */

    .nav-links {
  display: flex;
  align-items: center;

  gap: 7px;

  padding-right: 34px;

  font-family: Georgia, serif;

  color: #453949;

  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.9px;

  white-space: nowrap;

  text-shadow:
    0 1px 4px rgba(255, 255, 255, 0.9);
    }



    /* ----- 右上星盤 ----- */

    .contents-compass {
      position: absolute;

      top: 50%;
      right: 0;

      transform: translateY(-50%);

      width: 29px;
      height: auto;

      opacity: 0.9;
    }



    /* ----- 導覽下方細線 ----- */

    .header-divider {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-top: 13px;
    }

    .header-divider span {
      flex: 1;

      height: 1px;

      background:
        rgba(151, 119, 91, 0.48);
    }

    .header-divider b {
      color: #a98664;

      font-size: 10px;
      font-weight: normal;
    }



    /* ==================================================
       CONTENTS 標題 Logo
    ================================================== */

    .contents-title-wrap {
      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        24px 0 24px;
    }

    .contents-main-logo {
      display: block;

      width: min(84%, 500px);
      height: auto;
    }



    /* ==================================================
       館藏區｜COLLECTIONS
    ================================================== */

    .catalog {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
    }


    /* ----- 館藏排列 ----- */

    .collection-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 10px;
    }



    /* ----- 單張館藏卡 ----- */

    .collection {
      position: relative;

      grid-column:
        span 2;

      min-height:
        180px;

      padding:
        14px 8px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.72),
          rgba(239, 231, 240, 0.70)
        );

      border:
        1px solid rgba(165, 145, 167, 0.28);

      box-shadow:
        0 8px 20px rgba(82, 68, 90, 0.06);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .collection:active {
      transform:
        scale(0.98);

      box-shadow:
        0 4px 12px rgba(82, 68, 90, 0.08);
    }



    /* ----- 第二排兩張置中 ----- */

    .collection:nth-child(4) {
      grid-column:
        2 / span 2;
    }

    .collection:nth-child(5) {
      grid-column:
        4 / span 2;
    }



    /* ----- 編號 ----- */

    .collection-number {
      position: absolute;

      top: 10px;
      left: 12px;

      font-family: Georgia, serif;

      color: #b4a5b6;

      font-size: 10px;
      letter-spacing: 0.15em;
    }



    /* ----- 館藏圖片預留位置 ----- */

    .collection-art {
      position: relative;
      width: 100%;

      aspect-ratio:
        1 / 1;

      margin-bottom:
        12px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #b79e7d;

      font-size: 24px;
    }
.collection-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.collection-info {
  position: absolute;

  left: 10%;
  right: 10%;
  bottom: 8%;

  text-align: center;
}
    .collection-full {
  padding: 0;
  min-height: 0;
  aspect-ratio: 1 / 1;
}

    /* ----- 館名 ----- */

    .collection h2 {
      margin: 0;

      color: #695e70;

      font-size: 18px;
      font-weight: 500;

      letter-spacing: 0.12em;
    }



    /* ----- 分類 ----- */

   .collection p {
  margin:
    8px 0 0;

  color: #6f6275;

  font-size: 12px;
  font-weight: 500;

  letter-spacing: 0.08em;

  text-shadow:
  0 0 3px rgba(255, 255, 255, 1),
  0 0 7px rgba(255, 255, 255, 0.95);
   }



    /* ----- ENTER ----- */

    .collection-enter {
      margin-top:
        14px;

      color: #a48b6e;

      font-family: Georgia, serif;

      font-size: 12px;
      letter-spacing: 0.2em;
    }



    /* ==================================================
       BACK
    ================================================== */

    .back {
      margin-top:
        34px;

      text-align:

      cursor:

      font-family:

      color:

      font-size:

       手機版｜MOBILE

       大螢幕｜DESKTOP
    ================================================== */

    @media (min-width: 700px) {

          34px;
      }

      .brand-en {

          10px;
      }

      .brand-tagline {
        font-size:
          7px;
      }

      .nav-links {
        padding-right:
          58px;

        font-size:
          14px;
      }

      .contents-compass {
        width:
          46px;
      }

      .collection {
        min-height:
          240px;
      }

      .collection h2 {
        font-size:
          15px;
      }

      .collection p {
        font-size:
          9px;
      }

    }

.wanyan-page .wanyan-hero {

  position: absolute;

  z-index: 1;
  pointer-events: none;

      rgba(180, 151, 193, 0.22),

      to bottom,
      rgba(255, 255, 255, 0.22),
      rgba(255, 255, 255, 0)
    );
}

/* 綰胭人物 */
.wanyan-page .hero-character {
  position: absolute;
  width: 86%;
  max-width: none;
  right: -7%;
  top: 4%;
  margin: 0;
  z-index: 3;
}

/* 人物與背景融合 */
.wanyan-page .wanyan-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;

  background:
    linear-gradient(
      to right,
      rgba(246, 240, 242, 0.62) 0%,
      rgba(246, 240, 242, 0.18) 12%,
      rgba(246, 240, 242, 0) 27%
    ),
    linear-gradient(
      to bottom,
      rgba(246, 240, 242, 0) 70%,
      rgba(246, 240, 242, 0.10) 82%,
      rgba(246, 240, 242, 0.72) 100%
    );
}

/* 裝飾 */
.wanyan-page .hero-deco {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 4;
  opacity: 0.88;
  pointer-events: none;
}

/* 綰胭標準字 */
.wanyan-page .hero-title {
  position: absolute;
  width: 24%;
  height: auto;
  left: 4%;
  top: 17%;
  z-index: 5;
}

/* 引言區 */
.wanyan-page .hero-copy {
  position: absolute;
  left: 6%;
  bottom: 9%;
  width: 40%;
  padding: 13px 12px;
  z-index: 6;

  background: rgba(250, 247, 244, 0.68);
  border-left: 1px solid rgba(89, 63, 96, 0.32);
}

/* NO.13 */
.wanyan-page .hero-kicker {
  margin-bottom: 8px;
  font-family: Georgia, serif;
  font-size: 7px;
  letter-spacing: 0.16em;
  color: rgba(72, 54, 77, 0.62);
}

/* 引言 */
.wanyan-page .hero-quote {
  margin: 0;
  font-size: 11px;
  line-height: 1.9;
  letter-spacing: 0.05em;
  color: #493b4d;
}

/* 出處 */
.wanyan-page .hero-source {
  margin-top: 8px;
  font-size: 7px;
  letter-spacing: 0.08em;
  color: rgba(72, 54, 77, 0.58);
}

/* 手機 */
@media (max-width: 430px) {

  .wanyan-page .wanyan-hero {
    min-height: 680px;
  }

  .wanyan-page .hero-character {
    width: 91%;
    right: -10%;
    top: 5%;
  }

  .wanyan-page .hero-title {
    width: 23%;
    left: 4%;
    top: 17%;
  }

  .wanyan-page .hero-copy {
    left: 6%;
    bottom: 8%;
    width: 41%;
  }
}

   綰胭｜WANYAN CSS
   END
================================================== */

      window.scrollTo(0, 0);

    }


    function backHome() {

      document
        .getElementById("world-page")
        .style.display = "none";

      document
        .getElementById("cover-page")
        .style.display = "block";

      window.scrollTo(0, 0);

    }

  </script>
</body>
</html>
