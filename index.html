<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星汐｜此微夢</title>
  <style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #07060d;
  }
    .cover {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
    }
    .cover img {
  position: absolute;
}

.background,
.shards,
.frame {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
    .background { z-index: 1; }
.shards    { z-index: 2; }
.emblem    { z-index: 3; }
.logo      { z-index: 4; }
.frame     { z-index: 5; }
   .emblem,
.logo {
  left: 50%;
  transform: translateX(-50%);
  height: auto;
}

.shards {
  transform-origin: center center;
  animation: shards-drift 16s ease-in-out infinite;
}

@keyframes shards-drift {
  0%, 100% {
    transform: rotate(-0.4deg);
  }

  50% {
    transform: rotate(0.4deg);
  }
}

.emblem {
  width: 68%;
  top: 12%;

}

.logo {
  width: 62%;
  top: 46%;
}
    
  
    .shards {
  transform-origin: center center;
  animation: shards-drift 16s ease-in-out infinite;
}

@keyframes shards-drift {
  0%, 100% {
    transform: rotate(-0.4deg);
  }

  50% {
    transform: rotate(0.4deg);
  }
}
  
  </style>
</head>

<body>
  <main class="cover">
    <img class="background" src="images/home/background.png" alt="">
    <img class="shards" src="images/home/shards.png" alt="">
    <img class="emblem" src="images/home/emblem.png" alt="">
    <img class="logo" src="images/home/logo.png" alt="">
    <img class="frame" src="images/home/frame.png" alt="">
  </main>
</body>

</html>
