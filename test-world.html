<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>星汐｜切換測試</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07060d;
      color: #eadfc9;
      font-family: "Noto Serif TC", "PMingLiU", serif;
    }

    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    #world-page {
      display: none;
    }

    .enter {
      margin-top: 24px;
      padding: 14px 24px;
      cursor: pointer;
      letter-spacing: 0.3em;
    }

    .back {
      margin-top: 24px;
      cursor: pointer;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- 第一個畫面 -->
  <section class="page" id="cover-page">

    <h1>星汐</h1>

    <div>這裡是假裝自己是首頁的實驗鼠 🫠</div>

    <div class="enter" onclick="enterWorld()">
      ENTER
    </div>

  </section>


  <!-- 第二個畫面 -->
  <section class="page" id="world-page">

    <h1>世界頁出現了 ✦</h1>

    <div>
      但網址沒有換 ouo
    </div>

    <div class="back" onclick="backHome()">
      ← 回去
    </div>

  </section>


  <script>
    function enterWorld() {
      document.getElementById("cover-page").style.display = "none";
      document.getElementById("world-page").style.display = "flex";
    }

    function backHome() {
      document.getElementById("world-page").style.display = "none";
      document.getElementById("cover-page").style.display = "flex";
    }
  </script>

</body>

</html>
