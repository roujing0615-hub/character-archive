<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>星汐｜目錄測試</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Noto Serif TC", "PMingLiU", serif;
    }

    body {
      background: #07060d;
    }

    /* 第一畫面｜測試封面 */
    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    #cover-page {
      background: #07060d;
      color: #eadfc9;
    }

    .cover-title {
      margin: 0;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0.2em;
    }

    .cover-note {
      margin-top: 16px;
      opacity: 0.7;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    .enter {
      margin-top: 32px;
      padding: 14px 24px;
      cursor: pointer;
      letter-spacing: 0.35em;
      font-size: 13px;
      transition: opacity 0.25s ease;
    }

    .enter:active {
      opacity: 0.5;
    }

    /* 第二畫面｜目錄 */
    #world-page {
      display: none;
      width: 100%;
      min-height: 100vh;
      background:
        linear-gradient(
          rgba(248, 244, 239, 0.96),
          rgba(239, 234, 241, 0.98)
        );
      color: #5f5868;
      padding: 24px 18px 42px;
    }

    .catalog {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .catalog-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(126, 108, 133, 0.25);
    }

    .catalog-brand {
      font-size: 18px;
      letter-spacing: 0.18em;
      color: #71677b;
    }

    .catalog-small {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #a495a9;
    }

    .catalog-header {
      text-align: center;
      padding: 30px 0 26px;
    }

    .catalog-number {
      font-size: 16px;
      color: #b69b76;
      margin-bottom: 8px;
    }

    .catalog-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #756879;
    }

    .catalog-title {
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 0.35em;
      color: #8f8394;
    }

    .catalog-header p {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.8;
      color: #9a8f9e;
    }

    /* 館藏排列 */
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .collection {
      min-height: 190px;
      padding: 16px 14px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.72),
          rgba(239, 231, 240, 0.72)
        );
      border: 1px solid rgba(165, 145, 167, 0.28);
      box-shadow:
        0 8px 20px rgba(82, 68, 90, 0.06);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .collection:active {
      transform: scale(0.98);
      box-shadow:
        0 4px 12px rgba(82, 68, 90, 0.08);
    }

    .collection-number {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #b4a5b6;
    }

    .collection-mark {
      font-size: 25px;
      color: #b79e7d;
      margin-bottom: 12px;
    }

    .collection h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #695e70;
    }

    .collection p {
      margin: 8px 0 0;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #a094a3;
    }

    .collection-enter {
      margin-top: 16px;
      font-size: 8px;
      letter-spacing: 0.2em;
      color: #a48b6e;
    }

    /* 第五格置中 */
    .collection:last-child {
      grid-column: 1 / -1;
      width: calc(50% - 7px);
      justify-self: center;
    }

    .back {
      margin-top: 30px;
      text-align: center;
      cursor: pointer;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #998d9d;
    }

    .back:active {
      opacity: 0.5;
    }

    @media (min-width: 700px) {
      .collection-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .collection:last-child {
        grid-column: auto;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- 第一畫面 -->
  <section class="page" id="cover-page">

    <h1 class="cover-title">星汐</h1>

    <div class="cover-note">
      這裡還是假裝自己是首頁的實驗鼠 🫠
    </div>

    <div class="enter" onclick="enterWorld()">
      ENTER
    </div>

  </section>


  <!-- 第二畫面 -->
  <section id="world-page">

    <div class="catalog">

      <div class="catalog-top">
        <div class="catalog-brand">星汐</div>
        <div class="catalog-small">CHARACTER ARCHIVE</div>
      </div>

      <header class="catalog-header">

        <div class="catalog-number">✦</div>

        <h1>CONTENTS</h1>

        <div class="catalog-title">
          目錄
        </div>

        <p>
          循著故事留下的微光，尋見他們。
        </p>

      </header>


      <div class="collection-grid">

        <article class="collection">
          <span class="collection-number">01</span>
          <div class="collection-mark">◇</div>
          <h2>館藏名稱</h2>
          <p>世界觀系列</p>
          <span class="collection-enter">ENTER →</span>
        </article>


        <article class="collection">
          <span class="collection-number">02</span>
          <div class="collection-mark">◇</div>
          <h2>館藏名稱</h2>
          <p>世界觀系列</p>
          <span class="collection-enter">ENTER →</span>
        </article>


        <article class="collection">
          <span class="collection-number">03</span>
          <div class="collection-mark">◇</div>
          <h2>館藏名稱</h2>
          <p>世界觀系列</p>
          <span class="collection-enter">ENTER →</span>
        </article>


        <article class="collection">
          <span class="collection-number">04</span>
          <div class="collection-mark">◇</div>
          <h2>現代都市</h2>
          <p>故事收藏</p>
          <span class="collection-enter">ENTER →</span>
        </article>


        <article class="collection">
          <span class="collection-number">05</span>
          <div class="collection-mark">◇</div>
          <h2>館藏名稱</h2>
          <p>故事收藏</p>
          <span class="collection-enter">ENTER →</span>
        </article>

      </div>


      <div class="back" onclick="backHome()">
        ← BACK
      </div>

    </div>

  </section>


  <script>
    function enterWorld() {
      document.getElementById("cover-page").style.display = "none";
      document.getElementById("world-page").style.display = "block";
    }

    function backHome() {
      document.getElementById("world-page").style.display = "none";
      document.getElementById("cover-page").style.display = "flex";
    }
  </script>

</body>

</html>
